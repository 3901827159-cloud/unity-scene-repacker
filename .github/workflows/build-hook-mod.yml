name: Build Hook Mod DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o "HookModSource.zip" -d .
          ls -la

      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-mcs

      - name: Compile Hook Mod
        run: |
          mcs /target:library \
              /reference:Assembly-CSharp.dll \
              /reference:UnityEngine.dll \
              /reference:UnityEngine.CoreModule.dll \
              /reference:UnityEngine.AssetBundleModule.dll \
              /reference:MonoMod.RuntimeDetour.dll \
              /reference:System.Xml.Linq.dll \
              /out:PreloadCacheMod.dll \
              PreloadCacheMod.cs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PreloadCacheMod
          path: PreloadCacheMod.dll
