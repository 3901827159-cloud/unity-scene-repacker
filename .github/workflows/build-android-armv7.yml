name: Build Android ARMv7 .so (v10 - android Data dir probe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-armv7-v10.yml'
      - 'LSCR-package-v10-android-datadir.zip'

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source package exists
        run: |
          if [ ! -f "LSCR-package-v10-android-datadir.zip" ]; then
            echo "ERROR: LSCR-package-v10-android-datadir.zip not found in repository root!"
            ls -la *.zip 2>/dev/null || echo "No ZIP files found."
            exit 1
          fi
          echo "OK: Found LSCR-package-v10-android-datadir.zip ($(stat -c%s LSCR-package-v10-android-datadir.zip) bytes)"
          echo "MD5: $(md5sum LSCR-package-v10-android-datadir.zip | cut -d' ' -f1)"

      - name: Unzip source package
        run: |
          rm -rf LSCR-package
          unzip -o "LSCR-package-v10-android-datadir.zip" -d .
          echo "ZIP extracted."
          ls -la LSCR-package/unity-scene-repacker/src/ LSCR-package/rabex-env/src/reachable/

      - name: Verify critical source files
        run: |
          SRC=LSCR-package/unity-scene-repacker/src
          BIND=$SRC/../bindings/src
          ENV_SRC=LSCR-package/rabex-env/src

          fail() { echo "FATAL: $1"; exit 1; }

          echo "=== batched_cache.rs ==="
          [ -f "$SRC/batched_cache.rs" ] || fail "batched_cache.rs missing"
          # name-first flatten (THE fix; do NOT accept type-first)
          grep -q "node.m_Name.clone()," "$SRC/batched_cache.rs" && \
          grep -q "node.m_Type.clone()," "$SRC/batched_cache.rs" || \
            fail "flatten order must be (name, type)"
          if grep -q "out.push((" "$SRC/batched_cache.rs"; then :; fi
          # reject the v15 type-first variant
          grep -q "This is the same order the monobehaviour-typetree-dump file uses" "$SRC/batched_cache.rs" && \
            fail "batched_cache.rs still contains the v15 type-first marker"
          grep -q "MANIFEST_VERSION: u32 = 2" "$SRC/batched_cache.rs" || \
            fail "MANIFEST_VERSION should be 2"
          grep -q "pub missing: Vec<String>" "$SRC/batched_cache.rs" || \
            fail "SceneMeta.missing field missing (v9)"

          echo "=== monobehaviour_typetree_export.rs (upstream name-first reader) ==="
          grep -q "flat_nodes.push((name, ty, level, flags));" "$SRC/monobehaviour_typetree_export.rs" || \
            fail "dump reader must push (name, ty, ...) like upstream"

          echo "=== bindings: export_batched + v16 marker ==="
          grep -q "export_batched" "$BIND/lib.rs" || fail "bindings missing export_batched"
          grep -q "v16 missing-path-report build" "$BIND/lib.rs" || fail "bindings marker is not v16"
          grep -q "missing_paths.json" "$BIND/lib.rs" || fail "bindings missing missing_paths.json hint"

          echo "=== lib.rs: batched pipeline + missing report ==="
          grep -q "pub fn repack_scenes_batched" "$SRC/lib.rs" || fail "repack_scenes_batched missing"
          grep -q "pub fn pack_to_asset_bundle_from_cache" "$SRC/lib.rs" || fail "pack_to_asset_bundle_from_cache missing"
          grep -q "pub missing: Vec<String>" "$SRC/lib.rs" || fail "RepackScene.missing field missing (v9)"
          grep -q "missing_paths.json" "$SRC/lib.rs" || fail "phase1 missing_paths.json writer missing (v9)"

          echo "=== rabex-env: prune reports missing paths ==="
          grep -q "pub missing: Vec<String>" "$ENV_SRC/reachable/prune.rs" || fail "PruneSceneResult.missing missing (v9)"
          grep -q "Could not find path" "$ENV_SRC/reachable/prune.rs" || fail "prune missing-path log missing"

          echo "=== rabex-env PPtr zero-fix retained ==="
          grep -q "FIX: PPtr points to pruned object" "$ENV_SRC/trace_pptr.rs" || fail "trace_pptr zero-fix missing"
          echo "=== rabex-env: android Data-dir probe (v10) ==="
          grep -q "fn android_data_dir" "$ENV_SRC/resolver/game_files.rs" || fail "android data-dir probe missing (v10)"

          echo "=== All source verifications passed ==="

      - name: Install Rust
        run: |
          rustup --version
          rustup target add armv7-linux-androideabi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build libunityscenerepacker.so (armv7)
        run: |
          NDKBIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDKBIN/armv7a-linux-androideabi34-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR="$NDKBIN/llvm-ar"
          export RUSTFLAGS="-C link-arg=-landroid -C link-arg=-llog"
          cd LSCR-package/unity-scene-repacker/bindings
          cargo build --release --target armv7-linux-androideabi
          strip --strip-unneeded target/armv7-linux-androideabi/release/libunityscenerepacker.so
          ls -la target/armv7-linux-androideabi/release/*.so

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libunityscenerepacker-v10-armv7
          path: LSCR-package/unity-scene-repacker/bindings/target/armv7-linux-androideabi/release/libunityscenerepacker.so
          if-no-files-found: error
