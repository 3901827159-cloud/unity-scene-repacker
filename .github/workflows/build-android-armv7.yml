name: Build Android ARMv7 .so (Patched Final)

on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup --version
          rustup target add armv7-linux-androideabi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure Cargo
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          mkdir -p ~/.cargo
          echo "[target.armv7-linux-androideabi]" > ~/.cargo/config.toml
          echo 'linker = "'$NDK_HOME'/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"' >> ~/.cargo/config.toml

      - name: Fetch dependencies
        run: cargo fetch

      - name: Patch ALL for 32-bit (Python)
        run: |
          python3 << 'PYEOF'
          import os, glob

          # ===== 1. typetree-generator-api: DELETE all assertion lines =====
          for path in glob.glob(os.path.expanduser(
              "~/.cargo/git/checkouts/typetree-generator-api-bindings-*/src/generated.rs"
          )):
              print(f"[1] Cleaning {path}")
              with open(path, 'r') as f:
                  lines = f.readlines()
              result = []
              for line in lines:
                  # Delete ANY line containing ::std::mem:: (assertion body)
                  if '::std::mem::' in line:
                      continue
                  # Delete leftover description lines like ["Size of..."]
                  s = line.strip()
                  if s.startswith('["') and s.endswith('"]'):
                      continue
                  result.append(line)
              with open(path, 'w') as f:
                  f.writelines(result)
              print(f"    {len(lines)} -> {len(result)} lines")

          # ===== 2. dotnetdll table.rs: u64 -> usize =====
          for path in glob.glob(os.path.expanduser(
              "~/.cargo/registry/src/*/dotnetdll-*/src/binary/metadata/table.rs"
          )):
              print(f"[2] Patching {path}")
              with open(path, 'r') as f:
                  content = f.read()
              # Change mask type from u64 to usize
              content = content.replace('let mut mask = 0u64;', 'let mut mask = 0usize;')
              content = content.replace('let mut mask: u64 = 0;', 'let mut mask: usize = 0;')
              # Fix view_bits_mut (remove as usize, mask is already usize)
              content = content.replace('let slice = (mask as usize).view_bits_mut::<Lsb0>();',
                                        'let slice = mask.view_bits_mut::<Lsb0>();')
              content = content.replace('let mut mask_usize = mask as usize;\n                    let slice = mask_usize.view_bits_mut::<Lsb0>();',
                                        'let slice = mask.view_bits_mut::<Lsb0>();')
              with open(path, 'w') as f:
                  f.write(content)

          # ===== 3. dotnetdll header.rs: u64 -> usize =====
          for path in glob.glob(os.path.expanduser(
              "~/.cargo/registry/src/*/dotnetdll-*/src/binary/metadata/header.rs"
          )):
              print(f"[3] Patching {path}")
              with open(path, 'r') as f:
                  content = f.read()
              # Create a usize binding before view_bits
              content = content.replace(
                  'for (num, exists) in valid.view_bits::<Lsb0>().into_iter().enumerate() {',
                  'let valid_usize = valid as usize;\n                for (num, exists) in valid_usize.view_bits::<Lsb0>().into_iter().enumerate() {'
              )
              with open(path, 'w') as f:
                  f.write(content)

          print("[+] All patches done")
          PYEOF

      - name: Build bindings crate
        run: cargo build -p bindings --target armv7-linux-androideabi --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libunityscenerepacker-armv7
          path: target/armv7-linux-androideabi/release/libunityscenerepacker.so
