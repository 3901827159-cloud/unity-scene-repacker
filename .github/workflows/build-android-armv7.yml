name: Build Android ARMv7 .so (Patched)

on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup --version
          rustup target add armv7-linux-androideabi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure Cargo
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          mkdir -p ~/.cargo
          echo "[target.armv7-linux-androideabi]" > ~/.cargo/config.toml
          echo 'linker = "'$NDK_HOME'/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"' >> ~/.cargo/config.toml

      - name: Fetch dependencies
        run: cargo fetch

      - name: Patch typetree-generator-api (delete full assertion lines)
        run: |
          GEN_FILE=$(find ~/.cargo/git/checkouts -path "*/typetree-generator-api-bindings-*/src/generated.rs" | head -1)
          echo "Patching: $GEN_FILE"
          # Delete FULL lines: ["desc"][::std::mem::xxx - Nusize];
          sed -i '/\["[^"]*"\]\[::std::mem::.*- [0-9]*usize\];/d' "$GEN_FILE"
          # Also delete lines without description prefix
          sed -i '/\[::std::mem::.*- [0-9]*usize\]/d' "$GEN_FILE"
          echo "Remaining assertions:"
          grep -c "::std::mem::" "$GEN_FILE" || echo "0"

      - name: Patch dotnetdll u64 -> usize for 32-bit
        run: |
          TABLE_RS=$(find ~/.cargo/registry/src -path "*/dotnetdll-*/src/binary/metadata/table.rs" | head -1)
          HEADER_RS=$(find ~/.cargo/registry/src -path "*/dotnetdll-*/src/binary/metadata/header.rs" | head -1)
          
          if [ -n "$TABLE_RS" ]; then
            echo "Patching table.rs"
            sed -i 's/let slice = mask.view_bits_mut::<Lsb0>();/let slice = (mask as usize).view_bits_mut::<Lsb0>();/g' "$TABLE_RS"
          fi
          
          if [ -n "$HEADER_RS" ]; then
            echo "Patching header.rs"
            sed -i 's/valid.view_bits::<Lsb0>()/(valid as usize).view_bits::<Lsb0>()/g' "$HEADER_RS"
          fi

      - name: Build bindings crate
        run: cargo build -p bindings --target armv7-linux-androideabi --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libunityscenerepacker-armv7
          path: target/armv7-linux-androideabi/release/libunityscenerepacker.so
