name: Build Android ARMv7 .so (Patched)

on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup --version
          rustup target add armv7-linux-androideabi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure Cargo
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          mkdir -p ~/.cargo
          echo "[target.armv7-linux-androideabi]" > ~/.cargo/config.toml
          echo 'linker = "'$NDK_HOME'/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"' >> ~/.cargo/config.toml

      - name: Fetch dependencies (including git)
        run: cargo fetch

      - name: Patch typetree-generator-api for 32-bit
        run: |
          # Patch size assertion: 24 -> 16
          find ~/.cargo/git/checkouts -path "*/typetree-generator-api-bindings-*/src/generated.rs" | head -1 | xargs -I {} sed -i 's/size_of::<TypeTreeNodeNative>() - 24usize/size_of::<TypeTreeNodeNative>() - 16usize/g' {}
          # Patch align assertion: 8 -> 4
          find ~/.cargo/git/checkouts -path "*/typetree-generator-api-bindings-*/src/generated.rs" | head -1 | xargs -I {} sed -i 's/align_of::<TypeTreeNodeNative>() - 8usize/align_of::<TypeTreeNodeNative>() - 4usize/g' {}
          # Verify
          find ~/.cargo/git/checkouts -path "*/typetree-generator-api-bindings-*/src/generated.rs" | head -1 | xargs grep -n "TypeTreeNodeNative"

      - name: Build bindings crate
        run: cargo build -p bindings --target armv7-linux-androideabi --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libunityscenerepacker-armv7
          path: target/armv7-linux-androideabi/release/libunityscenerepacker.so

