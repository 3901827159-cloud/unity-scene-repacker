name: Build Android ARMv7 .so

on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Add Android ARMv7 target
        run: rustup target add armv7-linux-androideabi

      - name: Configure Cargo for cross-compile
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          mkdir -p ~/.cargo
          echo "[target.armv7-linux-androideabi]" > ~/.cargo/config.toml
          echo 'linker = "'$NDK_HOME'/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"' >> ~/.cargo/config.toml
          cat ~/.cargo/config.toml

      - name: Build bindings crate
        run: cargo build -p bindings --target armv7-linux-androideabi --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libunityscenerepacker-armv7
          path: target/armv7-linux-androideabi/release/libunityscenerepacker.so

