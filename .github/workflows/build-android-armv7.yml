name: Build Android ARMv7 .so (Patched)

on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup --version
          rustup target add armv7-linux-androideabi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure Cargo
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          mkdir -p ~/.cargo
          echo "[target.armv7-linux-androideabi]" > ~/.cargo/config.toml
          echo 'linker = "'$NDK_HOME'/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"' >> ~/.cargo/config.toml

      - name: Vendor dependencies
        run: cargo vendor vendor/

      - name: Patch typetree-generator-api for 32-bit
        run: |
          find vendor -path "*/typetree-generator-api-*/src/lib.rs" | head -1 | xargs -I {} sed -i 's/const _: () = assert!(std::mem::size_of::<TypeTreeNodeNative>() - 24 == 0);/const _: () = assert!(std::mem::size_of::<TypeTreeNodeNative>() == 16);/' {}
          find vendor -path "*/typetree-generator-api-*/src/*.rs" -exec sed -i 's/size_of::<TypeTreeNodeNative>() - 24/size_of::<TypeTreeNodeNative>() - 16/g' {} \;

      - name: Configure vendored sources
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [source.crates-io]
          replace-with = "vendored-sources"
          [source.vendored-sources]
          directory = "vendor"
          [target.armv7-linux-androideabi]
          linker = "${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          EOF

      - name: Build bindings crate
        run: cargo build -p bindings --target armv7-linux-androideabi --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libunityscenerepacker-armv7
          path: target/armv7-linux-androideabi/release/libunityscenerepacker.so
