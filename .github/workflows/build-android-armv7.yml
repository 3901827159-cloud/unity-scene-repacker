name: Build Android ARMv7 .so (Fixed)

on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup --version
          rustup target add armv7-linux-androideabi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure Cargo
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          mkdir -p ~/.cargo
          echo "[target.armv7-linux-androideabi]" > ~/.cargo/config.toml
          echo 'linker = "'$NDK_HOME'/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"' >> ~/.cargo/config.toml

      - name: Fetch dependencies
        run: cargo fetch

      - name: Patch ALL for 32-bit ARM
        run: |
          python3 << 'PYEOF'
          import os, glob, re

          # ===== 1. typetree-generator-api: DELETE all const assertion blocks =====
          for path in glob.glob(os.path.expanduser(
              "~/.cargo/git/checkouts/typetree-generator-api-bindings-*/src/generated.rs"
          )):
              print(f"[1] Cleaning {path}")
              with open(path, 'r') as f:
                  content = f.read()
              orig_len = len(content)
              content = re.sub(r'const\s+_\s*:\s*\(\)\s*=\s*\{[^{}]*\};', '', content, flags=re.DOTALL)
              lines = content.split('\n')
              result = []
              for line in lines:
                  if '::std::mem::' in line:
                      continue
                  s = line.strip()
                  if re.match(r'^\["[^"]+"\]$', s):
                      continue
                  result.append(line)
              content = '\n'.join(result)
              with open(path, 'w') as f:
                  f.write(content)
              print(f"    {orig_len} -> {len(content)} chars")

          # ===== 2. dotnetdll table.rs: u64 mask -> usize internally =====
          for path in glob.glob(os.path.expanduser(
              "~/.cargo/registry/src/*/dotnetdll-*/src/binary/metadata/table.rs"
          )):
              print(f"[2] Patching {path}")
              with open(path, 'r') as f:
                  content = f.read()

              content = re.sub(
                  r'(pub fn valid_mask\(&self\) -> u64 \{)\s*let mut mask = 0;',
                  r'\1\n        let mut mask = 0usize;',
                  content
              )
              content = re.sub(
                  r'(pub fn sorted_mask\(\) -> u64 \{)\s*let mut mask = 0;',
                  r'\1\n        let mut mask = 0usize;',
                  content
              )
              content = re.sub(
                  r'(pub fn valid_mask\(&self\) -> u64 \{[\s\S]*?)\n(\s+)mask\n(\s+)\}',
                  r'\1\n\2mask as u64\n\3}',
                  content
              )
              content = re.sub(
                  r'(pub fn sorted_mask\(\) -> u64 \{[\s\S]*?)\n(\s+)mask\n(\s+)\}',
                  r'\1\n\2mask as u64\n\3}',
                  content
              )

              with open(path, 'w') as f:
                  f.write(content)
              print("    table.rs patched")

          # ===== 3. dotnetdll header.rs: valid.view_bits -> usize binding =====
          for path in glob.glob(os.path.expanduser(
              "~/.cargo/registry/src/*/dotnetdll-*/src/binary/metadata/header.rs"
          )):
              print(f"[3] Patching {path}")
              with open(path, 'r') as f:
                  content = f.read()

              content = content.replace(
                  'for (num, exists) in valid.view_bits::<Lsb0>().into_iter().enumerate() {',
                  'let valid_usize = valid as usize;\n        for (num, exists) in valid_usize.view_bits::<Lsb0>().into_iter().enumerate() {'
              )

              with open(path, 'w') as f:
                  f.write(content)
              print("    header.rs patched")

          print("[+] All patches applied")
          PYEOF

      - name: Build bindings crate
        run: cargo build -p bindings --target armv7-linux-androideabi --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libunityscenerepacker-armv7
          path: target/armv7-linux-androideabi/release/libunityscenerepacker.so
